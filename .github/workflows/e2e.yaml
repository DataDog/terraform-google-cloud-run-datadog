name: E2E Test

# Full instrumentation lifecycle against live, ephemeral Cloud Run services
# for every examples runtime (sidecar-only + SSI where supported).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '*.tf'
      - 'e2e/**'
      - 'examples/**'
      - '.github/workflows/e2e.yaml'
  push:
    branches: [main]
    paths:
      - '*.tf'
      - 'e2e/**'
      - 'examples/**'
      - '.github/workflows/e2e.yaml'
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end test the module
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Google Cloud auth (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_E2E }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_E2E }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      # Mint short-lived Datadog credentials via dd-sts (GitHub OIDC -> Datadog).
      - name: Get Datadog credentials (dd-sts)
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: terraform-google-cloud-run-datadog-e2e

      - name: Build e2e workload images
        timeout-minutes: 30
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_E2E }}
          GCP_REGION: ${{ vars.GCP_REGION_E2E }}
          E2E_IMAGE_TAG: ${{ github.sha }}
        run: ./e2e/build_images.sh

      - name: Run e2e tests
        working-directory: e2e
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .image-env
          set +a
          go test -count=1 -v -timeout 120m -json ./... | jq --unbuffered -jr 'select(.Action == "output") | .Output'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_E2E }}
          GCP_REGION: ${{ vars.GCP_REGION_E2E }}
          DATADOG_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DATADOG_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          DD_SITE: ${{ vars.DD_SITE_E2E || 'datadoghq.com' }}
