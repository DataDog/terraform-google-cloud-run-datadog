name: Terraform Lint Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**'

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.65.0

      - name: Run TFLint
        run: |
          tflint --recursive --config "$(pwd)/.tflint.hcl"
          echo All files passed the linter!
